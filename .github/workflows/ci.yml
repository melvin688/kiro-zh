name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 语法检查（全部脚本）
        run: python -c "import compileall,sys; sys.exit(0 if compileall.compile_dir('scripts', quiet=1) else 1)"
      - name: 单元测试（离线）
        run: python -m unittest discover -s tests -v
      - name: 命令行参数自检
        run: |
          python scripts/apply.py --help
          python scripts/asar_tool.py --help
          python scripts/restore.py --help

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 语法检查
        run: python -c "import compileall,sys; sys.exit(0 if compileall.compile_dir('scripts', quiet=1) else 1)"
      - name: 单元测试（Linux 路径/重启分支）
        run: python -m unittest discover -s tests -v

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: syntax
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 PyInstaller
        run: pip install pyinstaller
      - name: 打包单文件 exe
        run: >
          python -m PyInstaller --onefile --noconfirm --clean
          --name kiro-zh --paths scripts --add-data "assets;assets"
          packaging/kiro_zh.py
      - name: 冒烟（--version / --help）
        run: |
          dist\kiro-zh.exe --version
          dist\kiro-zh.exe --help
          dist\kiro-zh.exe translate auto --help
      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/kiro-zh.exe
          generate_release_notes: true
          body: |
            Windows 单文件版：下载 `kiro-zh.exe` 双击，按回车开始汉化（需已装 Kiro 与中文语言包）。

            首次运行会被 SmartScreen 拦截：更多信息 → 仍要运行。
